server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne Docker — résolution dynamique
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API ChausSec
    # NB: proxy_pass sans URI quand l'adresse est une variable -> nginx transmet
    # l'URI de la requete originale telle quelle (necessaire pour forcer la
    # resolution DNS dynamique sans casser la reecriture de chemin).
    location ^~ /chaussec/ {
        set $chaussec_api chaussec-api;
        proxy_pass http://$chaussec_api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy vers Docker API
    location ^~ /docker {
        set $chaussec_api chaussec-api;
        proxy_pass http://$chaussec_api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }

    # Proxy vers Requin API
    location ^~ /requin {
        set $chaussec_api chaussec-api;
        proxy_pass http://$chaussec_api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }

    # Proxy vers OpenSearch (le prefixe /opensearch/ est retire, OpenSearch
    # attend des chemins racine)
    location ^~ /opensearch/ {
        rewrite ^/opensearch/(.*)$ /$1 break;
        set $opensearch_upstream opensearch;
        proxy_pass http://$opensearch_upstream:9200;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Proxy vers Grafana (embarqué en iframe, servi sous /grafana)
    location ^~ /grafana/ {
        set $grafana_upstream grafana;
        proxy_pass http://$grafana_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
