server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne Docker — résolution dynamique
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API ChausSec
    location ^~ /chaussec/ {
        proxy_pass http://chaussec-api:5050/chaussec/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy vers Docker API
    location ^~ /docker {
        proxy_pass http://chaussec-api:5050/docker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }

    # Proxy vers Requin API
    location ^~ /requin {
        proxy_pass http://chaussec-api:5050/requin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }

    # Proxy vers OpenSearch
    location ^~ /opensearch/ {
        proxy_pass http://opensearch:9200/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
