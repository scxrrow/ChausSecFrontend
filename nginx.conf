server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne Docker — résolution dynamique (évite le crash au démarrage)
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /chaussec/ {
        set $api http://chaussec-api:5050;
        proxy_pass $api/chaussec/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /docker {
        set $api http://chaussec-api:5050;
        proxy_pass $api/docker;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /requin {
        set $api http://chaussec-api:5050;
        proxy_pass $api/requin;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /opensearch/ {
        set $es http://opensearch:9200;
        proxy_pass $es/;
        proxy_set_header Host $host;
    }
}
